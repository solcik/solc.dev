# Continuous deployment to Vercel, gated on a green CI run.
#
# Opt-in: set repository *variables* VERCEL_ORG_ID + VERCEL_PROJECT_ID and the
# *secret* VERCEL_TOKEN. Then turn off Vercel's own Git auto-deploys
# ("git": { "deploymentEnabled": false } in vercel.json) so each commit deploys once.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  TARGET: ${{ github.event.workflow_run.head_branch == 'master' && 'production' || 'preview' }}
  PROD_FLAG: ${{ github.event.workflow_run.head_branch == 'master' && '--prod' || '' }}

jobs:
  deploy:
    if: >-
      vars.VERCEL_PROJECT_ID != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event.workflow_run.head_branch == 'master' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile

      - name: Pull Vercel settings
        run: bunx vercel@latest pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: bunx vercel@latest build $PROD_FLAG --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(bunx vercel@latest deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
